# hmrc-log-dashboard-frontend
# Runs OUTSIDE the MDTP platform: every platform integration bootstrap-frontend
# expects (datastream auditing, graphite metrics, auth microservice, tracking
# consent, contact-frontend) is disabled or pointed at an inert target below.

appName = "hmrc-log-dashboard-frontend"

include "frontend.conf"

play.http.router       = prod.Routes
play.http.errorHandler = "handlers.ErrorHandler"

play.filters.enabled += play.filters.csp.CSPFilter

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "config.Module"
# NOTE: uk.gov.hmrc.play.bootstrap.AuthModule is deliberately NOT enabled — it
# requires the platform auth microservice. Auth is a local session-cookie
# implementation behind the IdentifierAction seam (see config.Module).

mongodb.uri = "mongodb://localhost:27017/hmrc-log-dashboard-frontend"

# --- off-platform switches ---
auditing.enabled = false
microservice.metrics.graphite.enabled = false
bootstrap.filters.allowlist.enabled = false
tracking-consent-frontend.gtm.container = "transparent"
accessibility-statement.service-path = "/hmrc-log-dashboard"
contact-frontend.serviceId = "hmrc-log-dashboard"

play.i18n.langs = ["en"]

login {
  # Dev credentials (same as the original HmrcLogger app). Override via environment
  # variables for any deployment that is not a local dev box.
  username = "dev@hmrclogger.local"
  username = ${?HMRCLOG_LOGIN_USERNAME}
  password = "LetMeIn-2026!"
  password = ${?HMRCLOG_LOGIN_PASSWORD}
}

seed-on-startup = true

upload.max-size-bytes = 20971520

fraud-prevention {
  # Fewer distinct Gov-Client-Public-IP / Gov-Client-Device-ID / Gov-Client-Local-IPs values than this fails the check.
  min-distinct-client-values = 2
  # Fewer distinct Gov-Vendor-License-IDs than this raises a warning.
  min-distinct-licence-ids = 3
}
